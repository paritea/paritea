[project]
name = "paritea"
version = "0.1.0"
description = "A collection of tools for the FTQC researcher."
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE.md"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "frozendict>=2.4.6",
    "galois>=0.4.7",
    "notebook>=7.4.7",
    "pymatching>=2.3.1",
    "pyzx>=0.9.0",
    "recordclass>=0.23.1",
    "rustworkx>=0.17.1",
    "sinter>=1.16",
    "stim>=1.16",
]

[dependency-groups]
dev = [
    { include-group = "bench" },
    { include-group = "lint" },
    { include-group = "test" },
    "maturin>=1.4,<2.0",
]

bench = [
    "matplotlib>=3.9",
    "pyinstrument>=5.1.1",
    "pytest-benchmark>=5.1",
]

lint = [
    "pre-commit>=4.5.1",
    "ruff==0.14.9", # Pinned to ensure everyone uses the same rules
]

test = [
    "pytest>=8.4.2",
]


[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "paritea._bindings"
python-source = "src/"
manifest-path = "rust-bindings/Cargo.toml"
features = ["pyo3/extension-module"]       # skips linking against libpython.so
profile = "dev-py"
