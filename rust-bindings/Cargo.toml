[package]
name = "paritea-py"
description = "Python bindings for the supporting library"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
missing_docs = "warn"

[lib]
name = "rust"
crate-type = ["cdylib", "rlib"]
# This library requires a Python runtime to be tested, and no tests currently exist
doc = false
test = false
bench = false

[dependencies]
paritea = { path = "../rust" }
rustworkx-core = { workspace = true }

pyo3 = { version = "0.28.0", features = ["extension-module", "abi3-py310", "anyhow"] }
