[package]
name = "paritea-py"
description = "Python bindings for the supporting library"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.91.0"

[lints.rust]
missing_docs = "warn"

[lib]
name = "rust"
crate-type = ["cdylib", "rlib"]
# This library requires a Python runtime to be tested, and no tests currently exist
doc = false
test = false
bench = false

[dependencies]
derive_more = { workspace = true }
paritea = { path = "../rust" }

pyo3 = { version = "0.28.0", features = ["extension-module", "abi3-py310", "anyhow"] }
