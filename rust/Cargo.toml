[package]
name = "paritea"
description = "Supporting Rust library for paritea"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "rust"
crate-type = ["cdylib", "rlib"]

[lints.rust]
missing_docs = "warn"

[dependencies]
itertools.workspace = true
rustworkx-core.workspace = true
rustc-hash.workspace = true
bitgauss = "0.3.4"
delegate = "0.13.5"
fraction = "0.15.4"
num-bigint.workspace = true
derive_more.workspace = true
indicatif = "0.18.4"

pyo3 = { version = "0.28.0", features = ["extension-module", "abi3-py310", "anyhow", "num-bigint"], optional = true }

[features]
default = []
py = ["pyo3"]
